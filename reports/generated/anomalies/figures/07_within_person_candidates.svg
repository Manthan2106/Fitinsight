<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="328" viewBox="0 0 1100 328" role="img" aria-labelledby="title desc">
<title id="title">Within-person robust candidate counts</title>
<desc id="desc">Unique participant-days with an extreme within-person daily steps or active-share modified robust score.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="sans-serif" font-size="24" font-weight="700">Within-person robust candidate counts</text>
<text x="34" y="70" font-family="sans-serif" font-size="13" fill="#334155">n=457 participant-days; minimum 5 days per participant; absolute robust score threshold 3.5</text>
<rect x="235" y="91" width="13" height="13" fill="#0f766e"/>
<text x="254" y="102" font-family="sans-serif" font-size="12">Flagged participant-days</text>
<line x1="235.00" y1="155" x2="235.00" y2="214" stroke="#e2e8f0"/>
<text x="235.00" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">0</text>
<line x1="440.00" y1="155" x2="440.00" y2="214" stroke="#e2e8f0"/>
<text x="440.00" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">9.25</text>
<line x1="645.00" y1="155" x2="645.00" y2="214" stroke="#e2e8f0"/>
<text x="645.00" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">18.5</text>
<line x1="850.00" y1="155" x2="850.00" y2="214" stroke="#e2e8f0"/>
<text x="850.00" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">27.8</text>
<line x1="1055.00" y1="155" x2="1055.00" y2="214" stroke="#e2e8f0"/>
<text x="1055.00" y="233" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">37</text>
<text x="223" y="177.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">total_steps</text>
<rect x="235" y="162.00" width="820.00" height="10.00" fill="#0f766e"/>
<text x="223" y="204.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">active_share</text>
<rect x="235" y="189.00" width="687.03" height="10.00" fill="#0f766e"/>
<text x="645.0" y="259" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Flagged participant-days (count)</text>
<text x="34" y="284" font-family="sans-serif" font-size="12" fill="#334155">Interpretation: Within-person comparisons identify values unusual relative to each participant&#x27;s own observed records.</text>
<text x="34" y="302" font-family="sans-serif" font-size="12" fill="#334155">Limitation: Short and uneven observation histories limit each person&#x27;s reference distribution; a flag is not an error diagnosis.</text>
