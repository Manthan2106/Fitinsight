<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="436" viewBox="0 0 1100 436" role="img" aria-labelledby="title desc">
<title id="title">kNN score distribution summaries by coverage cohort</title>
<desc id="desc">Median and 95th-percentile mean-neighbor distance scores for pooled and completeness-stratified participant-day cohorts.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="34" y="42" font-family="sans-serif" font-size="24" font-weight="700">kNN score distribution summaries by coverage cohort</text>
<text x="34" y="70" font-family="sans-serif" font-size="13" fill="#334155">Rates standardized within each cohort; top 5% candidates; n=457 overall participant-days; k=5 and 10</text>
<rect x="235" y="91" width="13" height="13" fill="#2563eb"/>
<text x="254" y="102" font-family="sans-serif" font-size="12">Median score</text>
<rect x="379" y="91" width="13" height="13" fill="#d97706"/>
<text x="398" y="102" font-family="sans-serif" font-size="12">95th percentile</text>
<line x1="235.00" y1="155" x2="235.00" y2="322" stroke="#e2e8f0"/>
<text x="235.00" y="341" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">0</text>
<line x1="440.00" y1="155" x2="440.00" y2="322" stroke="#e2e8f0"/>
<text x="440.00" y="341" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">0.288</text>
<line x1="645.00" y1="155" x2="645.00" y2="322" stroke="#e2e8f0"/>
<text x="645.00" y="341" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">0.577</text>
<line x1="850.00" y1="155" x2="850.00" y2="322" stroke="#e2e8f0"/>
<text x="850.00" y="341" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">0.865</text>
<line x1="1055.00" y1="155" x2="1055.00" y2="322" stroke="#e2e8f0"/>
<text x="1055.00" y="341" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">1.15</text>
<text x="223" y="177.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">complete days k=5</text>
<rect x="235" y="162.00" width="172.71" height="10.00" fill="#2563eb"/>
<rect x="235" y="174.00" width="573.77" height="10.00" fill="#d97706"/>
<text x="223" y="204.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">complete days k=10</text>
<rect x="235" y="189.00" width="232.73" height="10.00" fill="#2563eb"/>
<rect x="235" y="201.00" width="788.82" height="10.00" fill="#d97706"/>
<text x="223" y="231.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">incomplete days k=5</text>
<rect x="235" y="216.00" width="217.37" height="10.00" fill="#2563eb"/>
<rect x="235" y="228.00" width="743.13" height="10.00" fill="#d97706"/>
<text x="223" y="258.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">incomplete days k=10</text>
<rect x="235" y="243.00" width="273.28" height="10.00" fill="#2563eb"/>
<rect x="235" y="255.00" width="820.00" height="10.00" fill="#d97706"/>
<text x="223" y="285.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">pooled k=5</text>
<rect x="235" y="270.00" width="148.57" height="10.00" fill="#2563eb"/>
<rect x="235" y="282.00" width="438.14" height="10.00" fill="#d97706"/>
<text x="223" y="312.50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#334155">pooled k=10</text>
<rect x="235" y="297.00" width="192.32" height="10.00" fill="#2563eb"/>
<rect x="235" y="309.00" width="575.29" height="10.00" fill="#d97706"/>
<text x="645.0" y="367" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Mean neighbor distance (standardized Euclidean units)</text>
<text x="34" y="392" font-family="sans-serif" font-size="12" fill="#334155">Interpretation: Within-cohort percentiles show the upper score tail under pooled and coverage-stratified comparisons.</text>
<text x="34" y="410" font-family="sans-serif" font-size="12" fill="#334155">Limitation: Each cohort is standardized separately; scores across cohorts are not directly interchangeable.</text>
</svg>
