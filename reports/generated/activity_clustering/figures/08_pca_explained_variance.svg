<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">PCA explained variance by component</title><desc id="desc">All-days cohort: n=35; four standardized input features. Explained variance describes dimensional compression, not evidence that a cluster solution is valid.</desc><rect width="100%" height="100%" fill="#fbfaf7"/><text x="42.00" y="48.00" font-family="Arial, sans-serif" font-size="25" fill="#193246" text-anchor="start" font-weight="700">PCA explained variance by component</text><text x="42.00" y="78.00" font-family="Arial, sans-serif" font-size="14" fill="#536674" text-anchor="start" font-weight="normal">All-days cohort: n=35; four standardized input features.</text><line x1="130.00" y1="500.00" x2="950.00" y2="500.00" stroke="#536674" stroke-width="1.00"/><line x1="130.00" y1="150.00" x2="130.00" y2="500.00" stroke="#536674" stroke-width="1.00"/><text x="540.00" y="542.00" font-family="Arial, sans-serif" font-size="14" fill="#273746" text-anchor="middle" font-weight="normal">Principal component</text><text x="50.00" y="325.00" font-family="Arial, sans-serif" font-size="13" fill="#273746" text-anchor="start" font-weight="normal" transform="rotate(-90 50 325)">Explained variance (%)</text><line x1="130.00" y1="500.00" x2="950.00" y2="500.00" stroke="#e1e5e8" stroke-width="1.00" stroke-dasharray="3 5"/><text x="118.00" y="504.00" font-family="Arial, sans-serif" font-size="11" fill="#273746" text-anchor="end" font-weight="normal">0%</text><line x1="130.00" y1="430.00" x2="950.00" y2="430.00" stroke="#e1e5e8" stroke-width="1.00" stroke-dasharray="3 5"/><text x="118.00" y="434.00" font-family="Arial, sans-serif" font-size="11" fill="#273746" text-anchor="end" font-weight="normal">20%</text><line x1="130.00" y1="360.00" x2="950.00" y2="360.00" stroke="#e1e5e8" stroke-width="1.00" stroke-dasharray="3 5"/><text x="118.00" y="364.00" font-family="Arial, sans-serif" font-si