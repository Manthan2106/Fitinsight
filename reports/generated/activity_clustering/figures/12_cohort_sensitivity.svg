<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Cohort and eligibility sensitivity</title><desc id="desc">Bar height is participant count; labels show selected K and ID-aligned ARI versus all-days. Cohorts are independently scaled and fitted; compare labels only for shared participants using ARI.</desc><rect width="100%" height="100%" fill="#fbfaf7"/><text x="42.00" y="48.00" font-family="Arial, sans-serif" font-size="25" fill="#193246" text-anchor="start" font-weight="700">Cohort and eligibility sensitivity</text><text x="42.00" y="78.00" font-family="Arial, sans-serif" font-size="14" fill="#536674" text-anchor="start" font-weight="normal">Bar height is participant count; labels show selected K and ID-aligned ARI versus all-days.</text><line x1="145.00" y1="450.00" x2="945.00" y2="450.00" stroke="#536674" stroke-width="1.00"/><line x1="145.00" y1="150.00" x2="145.00" y2="450.00" stroke="#536674" stroke-width="1.00"/><text x="48.00" y="300.00" font-family="Arial, sans-serif" font-size="13" fill="#273746" text-anchor="start" font-weight="normal" transform="rotate(-90 48 300)">Participants</text><rect x="190.00" y="150.00" width="110.00" height="300.00" rx="4.00" fill="#1F74AD" stroke="none"/><text x="245.00" y="140.00" font-family="Arial, sans-serif" font-size="12" fill="#273746" text-anchor="middle" font-weight="700">35</text><text x="245.00" y="478.00" font-family="Arial, sans-serif" font-size="11" fill="#273746" text-anchor="middle" font-weight="normal">all days</text><text x="245.00" y="498.00" font-family="Arial, sans-serif" font-size="11" fill="#536674" text-anchor="middle" font-weight="normal">K=3 · ARI=1.000</text><rect x="390.00" y="244.29" width="110.00" height="205.71" rx="4.00" fill="#1F74AD" stroke="none"/><text x="445.00" y="234.29" font-family="Arial, sans-serif" font-size="12" fill="#273746" text-anchor="middle" font-weight="700">24</text><text x="445.00" y="478.00" font-family="Arial, sans-serif" font-size="11" fill="#273746" text-anchor="middle" font-weight="normal">complete days</text><text x="445.00" y="498.00" font-family="Arial, sans-serif" font-size="11" fill="#536674" text-anchor="middle" font-weight="normal">K=2 · ARI=0.537</text><rect x="590.00" y="192.86" width="110.00" height="257.14" rx="4.00" fill="#1F74AD" stroke="none"/><text x="645.00" y="182.86" font-family="Arial, sans-serif" font-size="12" fill="#273746" text-anchor="middle" font-weight="700">30</text><text x="645.00" y="478.00" font-family="Arial, sans-serif" font-size="11" fill="#273746" text-anchor="middle" font-weight="normal">minimum 10 days</text><text x="645.00" y="498.00" font-family="Arial, sans-serif" font-size="11" fill="#536674" text-anchor="middle" font-weight="normal">K=3 · ARI=1.000</text><rect x="790.00" y="167.14" width="110.00" height="282.86" rx="4.00" fill="#1F74AD" stroke="none"/><text x="845.00" y="157.14" font-family="Arial, sans-serif" font-size="12" fill="#273746" text-anchor="middle" font-weight="700">33</text><text x="845.00" y="478.00" font-family="Arial, sans-serif" font-size="11" fill="#273746" text-anchor="middle" font-weight="normal">excluding top 2 mean steps</text><text x="845.00" y="498.00" font-family="Arial, sans-serif" font-size="11" fill="#536674" text-anchor="middle" font-weight="normal">K=2 · ARI=1.000</text><line x1="42.00" y1="590.00" x2="1038.00" y2="590.00" stroke="#d7dde1" stroke-width="1.00"/><text x="42.00" y="618.00" font-family="Arial, sans-serif" font-size="12" fill="#596a75" text-anchor="start" font-weight="normal">Cohorts are independently scaled and fitted; compare labels only for shared participants using ARI.</text></svg>
